name: synology-opentak

services:
  opentakserver:
    build:
      context: ./opentakserver
    container_name: opentakserver
    hostname: opentakserver
    restart: unless-stopped
    tty: true
    env_file: .env
    ports:
      - "${OTS_API_PORT:-8081}:8081"
    volumes:
      - ./data/ots:/app/ots:rw
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy
      mediamtx:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8081/api/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 90s

  cot-parser:
    image: ghcr.io/brian7704/ots_cot_parser:master
    container_name: ots-cot-parser
    restart: unless-stopped
    command: python3 /app/venv/bin/cot_parser
    healthcheck:
      disable: true
    env_file: .env
    volumes:
      - ./data/ots:/app/ots:rw
    depends_on:
      opentakserver:
        condition: service_healthy

  eud-handler:
    image: ghcr.io/brian7704/ots_eud_handler:master
    container_name: ots-eud-handler
    restart: unless-stopped
    command: python3 /app/venv/bin/eud_handler
    healthcheck:
      disable: true
    env_file: .env
    volumes:
      - ./data/ots:/app/ots:rw
    ports:
      - "${OTS_COT_PORT:-8088}:8088"

  eud-handler-ssl:
    image: ghcr.io/brian7704/ots_eud_handler_ssl:master
    container_name: ots-eud-handler-ssl
    restart: unless-stopped
    command: python3 /app/venv/bin/eud_handler --ssl
    healthcheck:
      disable: true
    env_file: .env
    volumes:
      - ./data/ots:/app/ots:rw
    ports:
      - "${OTS_SSL_COT_PORT:-8089}:8089"
    depends_on:
      opentakserver:
        condition: service_healthy

  webui:
    image: ghcr.io/brian7704/opentakserver-ui:master
    container_name: ots-webui
    restart: unless-stopped

  web-proxy:
    build:
      context: .
      dockerfile: ots/configs/nginx/Dockerfile
    container_name: ots-web-proxy
    restart: unless-stopped
    environment:
      OTS_WEBUI_ADDRESS: webui
      OTS_ADDRESS: opentakserver:8081
      MTX_ADDRESS: mediamtx
    ports:
      - "${OTS_WEB_PORT:-8080}:80"
      - "${OTS_HTTPS_PORT:-8443}:8443"
      - "${OTS_ENROLLMENT_PORT:-8446}:8446"
    volumes:
      - ./data/ots/ca:/app/ots/ca:ro
    depends_on:
      opentakserver:
        condition: service_healthy

  register:
    build:
      context: ./register
    container_name: opentak-register
    restart: unless-stopped
    env_file: .env
    environment:
      OTS_BASE_URL: http://opentakserver:8081
      DATA_DIR: /data
    ports:
      - "${REGISTER_PORT:-8787}:8080"
    volumes:
      - ./data/register:/data:rw
    depends_on:
      opentakserver:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ots-rabbitmq
    restart: unless-stopped
    volumes:
      - ./ots/configs/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./ots/configs/rabbitmq/99-opentakserver.conf:/etc/rabbitmq/conf.d/99-opentakserver.conf:ro
      - ./data/rabbitmq:/var/lib/rabbitmq:rw
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5

  mediamtx:
    image: bluenviron/mediamtx:1.13.0-ffmpeg
    container_name: ots-mediamtx
    restart: unless-stopped
    ports:
      - "${RTMP_PORT:-1935}:1935"
      - "${RTP_PORT:-8000}:8000/udp"
      - "${RTCP_PORT:-8001}:8001/udp"
      - "${WEBRTC_UDP_PORT:-8189}:8189/udp"
      - "${RTSP_PORT:-8554}:8554"
      - "${HLS_PORT:-8888}:8888"
      - "${WEBRTC_PORT:-8889}:8889"
      - "${SRT_PORT:-8890}:8890/udp"
    volumes:
      - ./ots/mediamtx/mediamtx.yml:/mediamtx.yml:ro

  database:
    image: postgis/postgis:18-3.6
    container_name: ots-database
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ots}"]
      interval: 5s
      timeout: 5s
      retries: 20
