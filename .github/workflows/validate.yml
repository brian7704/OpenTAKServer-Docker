name: Validate DSM source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q register scripts
      - name: Registration regression tests
        run: |
          python -m pip install -r register/requirements.txt
          python -m unittest discover -s register -p "test_*.py"
      - name: Shell syntax
        run: find . -name '*.sh' -not -path './.git/*' -exec sh -n {} \;
      - name: Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
      - name: Source hygiene and local README links
        run: python scripts/validate_source.py

